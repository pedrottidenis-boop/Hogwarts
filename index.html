<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lettera Magica di Hogwarts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030205;
      font-family: 'Cinzel', serif;
    }

    /* Initial Overlay Screen */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0a0812 0%, #020104 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 1.5s ease, visibility 1.5s ease;
    }

    #start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-text {
      font-family: 'Cinzel Decorative', 'Cinzel', serif;
      font-size: 1.6rem;
      color: #e2c075;
      text-align: center;
      padding: 20px;
      text-shadow: 0 0 12px rgba(226, 192, 117, 0.6), 0 0 25px rgba(212, 160, 23, 0.4);
      animation: pulseText 3s infinite ease-in-out;
      line-height: 1.5;
    }

    .tap-hint {
      margin-top: 25px;
      font-size: 0.9rem;
      color: #8c7853;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.75; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 18px rgba(226, 192, 117, 0.9), 0 0 35px rgba(212, 160, 23, 0.7); }
    }

    /* Page Container for Image */
    #page-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    #letter-img {
      max-width: 100%;
      max-height: 96vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
    }

    /* Canvas Overlays */
    #darkness-canvas, #sparkle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    #darkness-canvas { z-index: 10; }
    #sparkle-canvas { z-index: 20; }

    @media (max-width: 600px) {
      .intro-text { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="bg-music" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- Start Overlay -->
  <div id="start-overlay">
    <div class="intro-text">"La magia è sempre stata dentro di te"</div>
    <div class="tap-hint">Tocca lo schermo per iniziare</div>
  </div>

  <!-- Letter Image -->
  <div id="page-container">
    <img src="lettera.png" id="letter-img" alt="Lettera Magica di Hogwarts">
  </div>

  <!-- Canvas elements for darkness and magic light effects -->
  <canvas id="darkness-canvas"></canvas>
  <canvas id="sparkle-canvas"></canvas>

  <script>
    const overlay = document.getElementById('start-overlay');
    const audio = document.getElementById('bg-music');
    let hasStarted = false;

    function startExperience(e) {
      if (hasStarted) return;
      hasStarted = true;
      
      audio.volume = 0.6;
      audio.play().catch(err => console.log("Audio autoplay blocked:", err));

      overlay.classList.add('hidden');

      const touch = e.touches ? e.touches[0] : e;
      targetX = touch.clientX;
      targetY = touch.clientY;
      currentX = targetX;
      currentY = targetY;
      isPressed = true;
      touchStartTime = Date.now();
    }

    overlay.addEventListener('click', startExperience);
    overlay.addEventListener('touchstart', startExperience, { passive: false });

    const darkCanvas = document.getElementById('darkness-canvas');
    const darkCtx = darkCanvas.getContext('2d');
    const sparkCanvas = document.getElementById('sparkle-canvas');
    const sparkCtx = sparkCanvas.getContext('2d');

    let width, height;
    function resize() {
      width = darkCanvas.width = sparkCanvas.width = window.innerWidth;
      height = darkCanvas.height = sparkCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPressed = false;
    let currentX = -1000;
    let currentY = -1000;
    let targetX = -1000;
    let targetY = -1000;
    let touchStartTime = 0;
    let particles = [];

    function handlePointerDown(e) {
      if (!hasStarted) return;
      isPressed = true;
      touchStartTime = Date.now();
      updatePos(e);
    }

    function handlePointerMove(e) {
      if (!hasStarted) return;
      updatePos(e);
    }

    function handlePointerUp() {
      isPressed = false;
      touchStartTime = 0;
    }

    function updatePos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      targetX = clientX;
      targetY = clientY;
    }

    window.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    window.addEventListener('touchstart', handlePointerDown, { passive: true });
    window.addEventListener('touchmove', handlePointerMove, { passive: true });
    window.addEventListener('touchend', handlePointerUp);

    class GoldenSparkle {
      constructor(x, y) {
        this.x = x + (Math.random() - 0.5) * 20;
        this.y = y + (Math.random() - 0.5) * 20;
        this.size = Math.random() * 3.5 + 1.5;
        this.speedX = (Math.random() - 0.5) * 2.5;
        this.speedY = Math.random() * 2 + 1;
        this.life = 1.0;
        this.decay = Math.random() * 0.02 + 0.012;
        const hues = [45, 48, 52, 40];
        this.hue = hues[Math.floor(Math.random() * hues.length)];
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= this.decay;
        this.size *= 0.97;
      }

      draw(ctx) {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.life})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      currentX += (targetX - currentX) * 0.25;
      currentY += (targetY - currentY) * 0.25;

      darkCtx.clearRect(0, 0, width, height);
      darkCtx.fillStyle = 'rgba(3, 2, 6, 0.96)';
      darkCtx.fillRect(0, 0, width, height);

      if (isPressed) {
        const holdDuration = Date.now() - touchStartTime;
        let radius = 110;
        let intensity = 0.92;

        if (holdDuration > 1500) {
          const intenseProgress = Math.min(1, (holdDuration - 1500) / 1000);
          radius += intenseProgress * 70;
          intensity = 0.98;

          for (let i = 0; i < 2; i++) {
            particles.push(new GoldenSparkle(currentX, currentY));
          }
        } else {
          if (Math.random() < 0.4) {
            particles.push(new GoldenSparkle(currentX, currentY));
          }
        }

        darkCtx.save();
        darkCtx.globalCompositeOperation = 'destination-out';

        const lightGradient = darkCtx.createRadialGradient(
          currentX, currentY, 0,
          currentX, currentY, radius
        );
        lightGradient.addColorStop(0, `rgba(0, 0, 0, ${intensity})`);
        lightGradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.75)');
        lightGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        darkCtx.fillStyle = lightGradient;
        darkCtx.beginPath();
        darkCtx.arc(currentX, currentY, radius, 0, Math.PI * 2);
        darkCtx.fill();
        darkCtx.restore();

        darkCtx.save();
        darkCtx.globalCompositeOperation = 'source-over';
        const haloGradient = darkCtx.createRadialGradient(
          currentX, currentY, radius * 0.7,
          currentX, currentY, radius * 1.15
        );
        haloGradient.addColorStop(0, 'rgba(255, 215, 120, 0.25)');
        haloGradient.addColorStop(0.5, 'rgba(212, 160, 23, 0.12)');
        haloGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        darkCtx.fillStyle = haloGradient;
        darkCtx.beginPath();
        darkCtx.arc(currentX, currentY, radius * 1.15, 0, Math.PI * 2);
        darkCtx.fill();
        darkCtx.restore();
      }

      sparkCtx.clearRect(0, 0, width, height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(sparkCtx);
        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    animate();
  </script>
</body>
</html>
